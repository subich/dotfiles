# vim:set ft=tmux:
%hidden MODULE_NAME="copilot"

# Colorize the usage text at the medium and high thresholds; keep the
# background constant so only the number changes color.
set -ogq @copilot_medium_thresh "80"
set -ogq @copilot_high_thresh "100"
set -ogqF @copilot_low_fg_color "#{E:@thm_fg}"
set -ogqF @copilot_medium_fg_color "#{E:@thm_yellow}"
set -ogqF @copilot_high_fg_color "#{E:@thm_red}"
set -ogqF @copilot_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -ogqF @copilot_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -ogqF @copilot_high_bg_color "#{E:@catppuccin_status_module_text_bg}"

set -ogq @copilot_purple "#8534F3"
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@copilot_purple}"
set -ogq "@catppuccin_${MODULE_NAME}_icon" " "
set -ogq "@catppuccin_${MODULE_NAME}_text" \
  " #(~/.config/tmux/packages/copilot/copilot-credits percentage)"
set -ogq "@catppuccin_status_${MODULE_NAME}_text_fg" \
  "#(~/.config/tmux/packages/copilot/copilot-credits fg-color)"
set -ogq "@catppuccin_status_${MODULE_NAME}_text_bg" \
  "#(~/.config/tmux/packages/copilot/copilot-credits bg-color)"

source-file "~/.config/tmux/themes/catppuccin/utils/status_module.conf"

set -ag status-right "#{E:@catppuccin_status_copilot}"
