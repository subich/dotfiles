# vim:set ft=tmux:
%hidden MODULE_NAME="kiro"

# Colorize the usage text at the medium and high thresholds; keep the
# background constant so only the number changes color.
set -ogq @kiro_medium_thresh "80"
set -ogq @kiro_high_thresh "100"
set -ogqF @kiro_low_fg_color "#{E:@thm_fg}"
set -ogqF @kiro_medium_fg_color "#{E:@thm_yellow}"
set -ogqF @kiro_high_fg_color "#{E:@thm_red}"
set -ogqF @kiro_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -ogqF @kiro_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -ogqF @kiro_high_bg_color "#{E:@catppuccin_status_module_text_bg}"

set -ogq @kiro_purple "#7B61FF"
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@kiro_purple}"
set -ogq "@catppuccin_${MODULE_NAME}_icon" "󰚩 "
set -ogq "@catppuccin_${MODULE_NAME}_text" \
  " #(~/.config/tmux/packages/kiro/kiro-credits percentage)"
set -ogq "@catppuccin_status_${MODULE_NAME}_text_fg" \
  "#(~/.config/tmux/packages/kiro/kiro-credits fg-color)"
set -ogq "@catppuccin_status_${MODULE_NAME}_text_bg" \
  "#(~/.config/tmux/packages/kiro/kiro-credits bg-color)"

source-file "~/.config/tmux/themes/catppuccin/utils/status_module.conf"

# Run Kiro in a labeled pane beside the current project shell.
bind K split-window -h -l 70% -c "#{pane_current_path}" \
  'kiro-cli chat; exec "$SHELL" -l' \; select-pane -T "kiro"
bind C-k split-window -h -l 70% -c "#{pane_current_path}" \
  'kiro-cli chat --resume-picker; exec "$SHELL" -l' \; \
  select-pane -T "kiro-resume"

set -ag status-right "#{E:@catppuccin_status_kiro}"
